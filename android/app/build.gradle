plugins { id 'com.android.application' }
android {
 namespace 'com.craftly.app'
 compileSdk 35
 defaultConfig { applicationId 'com.craftly.explorer'; minSdk 26; targetSdk 35; versionCode 5; versionName '1.4.0' }
 buildFeatures { buildConfig true }
 flavorDimensions += 'audience'
 productFlavors {
  explorer { dimension 'audience'; applicationId 'com.craftly.explorer'; resValue 'string', 'app_name', 'Craftly'; buildConfigField 'boolean', 'IS_ADMIN', 'false' }
  studio { dimension 'audience'; applicationId 'com.craftly.studio'; resValue 'string', 'app_name', 'Craftly Studio'; buildConfigField 'boolean', 'IS_ADMIN', 'true' }
 }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
