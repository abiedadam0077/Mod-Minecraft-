<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8f9fc"><meta name="description" content="Craftly — a little upgrade. A whole new world. Discover Minecraft Bedrock add-ons, worlds and textures."><link rel="preload" as="image" href="./images/welcome-night.webp"><title>Craftly — Your next world awaits</title><link rel="icon" href="/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
#startup-splash{position:fixed;inset:0;z-index:250;background:#100b23;color:#fff;display:grid;place-items:center;overflow:hidden;transition:opacity .25s ease}#startup-splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72}#startup-splash:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0b071ff5,transparent 85%)}.splash-brand{position:relative;z-index:1;text-align:center;margin-top:27vh;animation:splash-in .7s ease both}.splash-brand svg{width:76px;height:76px;filter:drop-shadow(0 6px 25px #8b40fa88)}.splash-brand .splash-icon{position:static;width:82px;height:82px;border-radius:23px;opacity:1;box-shadow:0 8px 35px #673abd55}.splash-brand h1{font:800 52px/1.2 system-ui,sans-serif;letter-spacing:-2px;margin:16px 0 12px}.splash-brand p{font:11px system-ui,sans-serif;letter-spacing:3px;color:#d9cdeb}.splash-dots{display:flex;gap:6px;justify-content:center;margin-top:45px}.splash-dots i{height:5px;width:5px;border-radius:50%;background:#b891fb;animation:splash-pulse 1s ease infinite alternate}.splash-dots i:nth-child(2){animation-delay:.2s}.splash-dots i:nth-child(3){animation-delay:.4s}#startup-splash.leaving{opacity:0;pointer-events:none}@keyframes splash-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes splash-pulse{to{opacity:.25}}@media(prefers-reduced-motion:reduce){.splash-brand,.splash-dots i{animation:none}}
</style></head><body><div id="startup-splash" role="status" aria-label="Starting Craftly"><img src="./images/welcome-night.webp" alt=""><div class="splash-brand"><img class="splash-icon" src="./images/craftly-icon.webp" alt="Craftly"><h1>Craftly</h1><p>MODS. TEXTURES. WORLDS. MORE.</p><div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div></div></div><div id="app"></div><div id="overlay"></div><div id="toast" role="status"></div><script type="module" src="/src/main.js"></script></body></html>
