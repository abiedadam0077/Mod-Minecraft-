name: Build Craftly apps
on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0e47b-mod-minecraft']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'releases/**'
      - '.github/workflows/publish-release.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm ci
      - run: npm test
      - name: Test Supabase client flows with mocked API
        run: node scripts/cloud-browser-check.mjs
      - name: Test compatibility with existing manual-only schema
        run: LEGACY_SCHEMA=1 node scripts/cloud-browser-check.mjs
      - name: Type-check the backend Edge Function
        run: npx --yes deno check supabase/functions/content-hub/index.ts
      - name: Verify live Supabase public access and RLS
        run: node scripts/check-cloud.mjs
      - run: npm run build:apk
      - name: Package Android and iOS icon assets
        run: python3 scripts/package-icons.py
      - uses: actions/upload-artifact@v4
        with:
          name: craftly-android-apps
          path: artifacts/*
          retention-days: 30
      - name: Publish APKs on the session branch
        id: package
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin arena/01a0e47b-mod-minecraft
          if [ "$(git rev-parse origin/arena/01a0e47b-mod-minecraft)" != "$SOURCE_COMMIT" ]; then
            echo "A newer source commit exists; keep this run's artifacts only."
            exit 0
          fi
          mkdir -p releases
          cp artifacts/*.apk artifacts/CONNECTIVITY.json releases/
          (cd releases && sha256sum *.apk > SHA256SUMS)
          printf 'Debug APKs built from source commit %s by GitHub Actions.\n' "$SOURCE_COMMIT" > releases/BUILD.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f releases/*.apk releases/SHA256SUMS releases/BUILD.txt releases/CONNECTIVITY.json
          git commit -m 'Package Craftly Android test builds [skip ci]'
          git push origin HEAD:arena/01a0e47b-mod-minecraft
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Publish Supabase APK release
        if: steps.package.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.0-hub >/dev/null 2>&1; then
            gh release upload v1.4.0-hub artifacts/*.apk artifacts/craftly-icons.zip artifacts/CONNECTIVITY.json releases/SHA256SUMS releases/BUILD.txt --clobber
          else
            gh release create v1.4.0-hub artifacts/*.apk artifacts/craftly-icons.zip artifacts/CONNECTIVITY.json releases/SHA256SUMS releases/BUILD.txt --target "$GITHUB_SHA" --title 'Craftly 1.4 — Hybrid Bedrock Content Hub' --notes-file docs/HUB-RELEASE.md --prerelease
          fi
