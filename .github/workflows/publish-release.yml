name: Publish downloadable Craftly release
on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0e47b-mod-minecraft']
    paths:
      - '.github/workflows/publish-release.yml'
      - 'docs/RELEASE-NOTES.md'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify packaged APKs
        run: cd releases && sha256sum -c SHA256SUMS
      - name: Publish test release and APK attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0-preview >/dev/null 2>&1; then
            gh release upload v1.0.0-preview releases/craftly-explorer.apk releases/craftly-studio.apk releases/SHA256SUMS releases/BUILD.txt --clobber
            gh release edit v1.0.0-preview --draft=false --prerelease --notes-file docs/RELEASE-NOTES.md
          else
            gh release create v1.0.0-preview releases/craftly-explorer.apk releases/craftly-studio.apk releases/SHA256SUMS releases/BUILD.txt --target "$GITHUB_SHA" --title 'Craftly 1.0.0 Preview — تطبيق المستخدم والأدمن' --notes-file docs/RELEASE-NOTES.md --prerelease
          fi
