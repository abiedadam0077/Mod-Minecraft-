name: "بناء APK معدّل — Zalith Launcher 2"

# يبني نسخة معدّلة من Zalith Launcher 2 (تشغيل الحسابات غير الرسمية / offline):
#   1) ينزّل المشروع الأصلي من GitHub
#   2) يطبّق التعديلات من مجلد patches/
#   3) يبني الـ APK (debug) لبنيتي المعالج arm64 و arm
#   4) يتحقق أن التعديل فعلاً داخل الـ APK
#   5) يعيد التوقيع بكل المخططات (v1 + v2 + v3) لأن MIUI وبعض الأجهزة ترفض
#      الحزم التي لا تحتوي توقيع v1 (JAR) وتظهر رسالة «الحزمة تبدو غير صالحة»
#   6) يتحقق من التوقيع بـ apksigner ويفشل البناء إذا كان التوقيع غير صالح
#   7) ينشر النتائج في صفحة Releases

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "بنية المعالج"
        type: choice
        default: all-selected
        options:
          - all-selected
          - arm64
          - arm
          - x86_64
          - all
      upstream_ref:
        description: "نسخة ZalithLauncher2 الأصلية (commit SHA أو فرع)"
        type: string
        default: e6cb4f415930c78ce1ecc10062b2bc1026802d4d
  push:
    paths:
      - "patches/**"
      - ".github/workflows/build-apk.yml"
      - "UPSTREAM_COMMIT"

permissions:
  contents: write

jobs:
  setup:
    name: تجهيز المصفوفة
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          IN='${{ github.event_name == 'push' && 'all-selected' || inputs.arch }}'
          case "$IN" in
            arm64|arm|x86_64|all) JSON="[\"$IN\"]" ;;
            *) JSON='["arm64","arm"]' ;;
          esac
          echo "matrix={\"arch\":$JSON}" >> "$GITHUB_OUTPUT"
          echo "المصفوفة: $JSON"

  build:
    name: Build (${{ matrix.arch }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      ARCH: ${{ matrix.arch }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'e6cb4f415930c78ce1ecc10062b2bc1026802d4d' }}
      # كلمة سر مفتاح التوقيع (نفس القيمة الافتراضية الموجودة في ZalithLauncher/gradle.properties)
      KS_PASS: ${{ secrets.DEBUG_KEY_PASSWORD }}

    steps:
      - name: تنزيل هذا المستودع (التعديلات)
        uses: actions/checkout@v6

      - name: تنزيل ZalithLauncher2 الأصلي
        run: |
          set -euo pipefail
          git init -q upstream
          cd upstream
          git remote add origin https://github.com/ZalithLauncher/ZalithLauncher2.git
          git fetch -q --depth 1 origin "$UPSTREAM_REF"
          git checkout -q FETCH_HEAD
          echo "ZalithLauncher2 commit: $(git rev-parse HEAD)"

      - name: تطبيق التعديلات (تشغيل الحسابات غير الرسمية)
        run: |
          set -euo pipefail
          cd upstream
          for p in ../patches/*.patch; do
            echo "==> applying: $p"
            git apply -p1 --verbose "$p"
          done
          echo "--- التعديلات المطبّقة ---"
          git --no-pager diff --stat

      - name: تهيئة JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: تهيئة Gradle (مع الكاش)
        uses: gradle/actions/setup-gradle@v5

      - name: بناء الـ APK
        working-directory: upstream
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew "ZalithLauncher:assembleDebug" "-Darch=$ARCH"

      - name: تجميع ملفات الـ APK الناتجة
        run: |
          set -euo pipefail
          mkdir -p work out
          find upstream/ZalithLauncher/build/outputs/apk/debug -name "*.apk" -exec cp -v {} work/ \;
          ls -lh work/

      - name: التحقق من أن الـ APK يحتوي فعلاً على التعديل
        run: |
          set -euo pipefail
          APK="$(ls work/*.apk | head -1)"
          rm -rf dexcheck && mkdir -p dexcheck
          unzip -o -q "$APK" "classes*.dex" -d dexcheck
          if strings dexcheck/classes*.dex | grep -q "circumventLimit"; then
            echo "::error::الـ APK ما زال يحتوي على كود القيد (checkLimit) — التعديل لم يُطبَّق!"
            exit 1
          fi
          if ! strings dexcheck/classes*.dex | grep -q "MOD_ZALITH_OFFLINE_ACCOUNTS"; then
            echo "::error::علامة التعديل غير موجودة في الـ APK!"
            exit 1
          fi
          echo "✅ الـ APK مبني من الكود المعدّل (بدون قيد الحسابات غير الرسمية)."

      - name: إعادة التوقيع بكل المخططات (v1 + v2 + v3)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          APKSIGNER="$(command -v apksigner || true)"
          ZIPALIGN="$(command -v zipalign || true)"
          [ -n "$APKSIGNER" ] || APKSIGNER="$BT/apksigner"
          [ -n "$ZIPALIGN" ] || ZIPALIGN="$BT/zipalign"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" --version || true

          # كلمة سر مفتاح التصحيح: من الأسرار إن وُجدت، وإلا القيمة الافتراضية في المشروع
          PASS="${KS_PASS}"
          if [ -z "$PASS" ]; then
            PASS="$(grep -E '^default_store_password=' upstream/ZalithLauncher/gradle.properties | cut -d= -f2-)"
            KEYPASS="$(grep -E '^default_key_password=' upstream/ZalithLauncher/gradle.properties | cut -d= -f2-)"
          else
            KEYPASS="$PASS"
          fi

          mkdir -p report
          # تشخيص: ماذا أنتج Gradle أصلاً؟
          for apk in work/*.apk; do
            echo "=== فحص توقيع APK من Gradle: $(basename "$apk") ===" | tee -a report/signature-report.txt
            "$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1 | tee -a report/signature-report.txt || true
          done

          version="$(grep -E '^launcher_version_name=' upstream/ZalithLauncher/gradle.properties | cut -d= -f2-)"
          case "$ARCH" in
            arm64) ABIFLAG="arm64-v8a" ;;
            arm)   ABIFLAG="armeabi-v7a" ;;
            *)     ABIFLAG="$ARCH" ;;
          esac

          for apk in work/*.apk; do
            aligned="work/aligned-$(basename "$apk")"
            "$ZIPALIGN" -p -f 4 "$apk" "$aligned" 2>/dev/null || "$ZIPALIGN" -f 4 "$apk" "$aligned"
            "$APKSIGNER" sign \
              --ks upstream/ZalithLauncher/zalith_launcher_debug.jks \
              --ks-type PKCS12 \
              --ks-key-alias movtery_zalith_debug \
              --ks-pass "pass:$PASS" \
              --key-pass "pass:$KEYPASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --min-sdk-version 26 \
              --out "out/ZalithLauncher-${version}-mod-offline-${ABIFLAG}.apk" \
              "$aligned"
          done
          ls -lh out/

          echo "=== فحص توقيع الملف النهائي ===" | tee -a report/signature-report.txt
          if ! "$APKSIGNER" verify --verbose --print-certs out/*.apk 2>&1 | tee -a report/signature-report.txt; then
            echo "::error::فشل التحقق من توقيع الـ APK النهائي!"
            exit 1
          fi
          for s in v1 v2 v3; do
            if ! grep -qE "Verified using $s scheme.*true" report/signature-report.txt; then
              echo "::error::مخطط التوقيع $s غير مُفعّل في الـ APK النهائي!"
              exit 1
            fi
          done
          echo "✅ التوقيع سليم: v1 + v2 + v3 مُفعّلة."
          sha256sum out/*.apk | tee -a report/signature-report.txt

      - name: رفع الـ APK كـ Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zalith-offline-${{ matrix.arch }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: نشر الـ APK في صفحة Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="mod-offline"
          TITLE="Zalith Launcher 2 — نسخة معدّلة (حسابات غير رسمية)"
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" out/*.apk --clobber && break
            else
              gh release create "$TAG" out/*.apk --title "$TITLE" --notes-file .github/RELEASE_NOTES.md && break
            fi
            sleep 10
          done
          gh release view "$TAG" --json assets --jq '.assets[]|"\(.name)  \(.size) bytes"'

      - name: نشر تقرير الفحص (للتشخيص)
        if: ${{ matrix.arch == 'arm64' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ci-report"
          {
            echo "تقرير فحص توقيع الـ APK — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo '```'
            cat report/signature-report.txt
            echo '```'
          } > report/body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file report/body.md
          else
            gh release create "$TAG" --title "CI report" --notes-file report/body.md
          fi
