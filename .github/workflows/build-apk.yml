name: "بناء APK معدّل — Zalith Launcher 2"

# يبني نسخة معدّلة من Zalith Launcher 2 (تشغيل الحسابات غير الرسمية / offline):
#   1) ينزّل المشروع الأصلي من GitHub
#   2) يطبّق التعديلات من مجلد patches/
#   3) يبني الـ APK (debug) لبنيتي المعالج arm64 و arm
#   4) يتحقق أن التعديل فعلاً داخل الـ APK
#   5) يعيد التوقيع بكل المخططات (v1 + v2 + v3) لأن MIUI وبعض المديرين يرفضون
#      الحزم بلا توقيع v1 (JAR) وتظهر رسالة «الحزمة تبدو غير صالحة»
#   6) يتحقق من التوقيع ويفشل البناء إذا كان ناقصًا
#   7) ينشر النتائج + تقرير الفحص في صفحة Releases

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "بنية المعالج"
        type: choice
        default: all-selected
        options:
          - all-selected
          - arm64
          - arm
          - x86_64
          - all
      upstream_ref:
        description: "نسخة ZalithLauncher2 الأصلية (commit SHA أو فرع)"
        type: string
        default: e6cb4f415930c78ce1ecc10062b2bc1026802d4d
  push:
    paths:
      - "patches/**"
      - ".github/workflows/build-apk.yml"
      - "UPSTREAM_COMMIT"

permissions:
  contents: write

jobs:
  setup:
    name: تجهيز المصفوفة
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          IN='${{ github.event_name == 'push' && 'all-selected' || inputs.arch }}'
          case "$IN" in
            arm64|arm|x86_64|all) JSON="[\"$IN\"]" ;;
            *) JSON='["arm64","arm"]' ;;
          esac
          echo "matrix={\"arch\":$JSON}" >> "$GITHUB_OUTPUT"
          echo "المصفوفة: $JSON"

  build:
    name: Build (${{ matrix.arch }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      ARCH: ${{ matrix.arch }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'e6cb4f415930c78ce1ecc10062b2bc1026802d4d' }}
      KS_PASS: ${{ secrets.DEBUG_KEY_PASSWORD }}

    steps:
      - name: تنزيل هذا المستودع (التعديلات)
        uses: actions/checkout@v6

      - name: تنزيل ZalithLauncher2 الأصلي
        run: |
          set -euo pipefail
          git init -q upstream
          cd upstream
          git remote add origin https://github.com/ZalithLauncher/ZalithLauncher2.git
          git fetch -q --depth 1 origin "$UPSTREAM_REF"
          git checkout -q FETCH_HEAD
          echo "ZalithLauncher2 commit: $(git rev-parse HEAD)"

      - name: تطبيق التعديلات (تشغيل الحسابات غير الرسمية)
        run: |
          set -euo pipefail
          cd upstream
          for p in ../patches/*.patch; do
            echo "==> applying: $p"
            git apply -p1 --verbose "$p"
          done
          echo "--- التعديلات المطبّقة ---"
          git --no-pager diff --stat

      - name: تهيئة JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: تهيئة Gradle (مع الكاش)
        uses: gradle/actions/setup-gradle@v5

      - name: بناء الـ APK
        working-directory: upstream
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew "ZalithLauncher:assembleDebug" "-Darch=$ARCH"

      - name: تجميع ملفات الـ APK الناتجة
        run: |
          set -euo pipefail
          mkdir -p work out report
          find upstream/ZalithLauncher/build/outputs/apk/debug -name "*.apk" -exec cp -v {} work/ \;
          ls -lh work/

      - name: التحقق من أن الـ APK يحتوي فعلاً على التعديل
        run: |
          set -euo pipefail
          APK="$(ls work/*.apk | head -1)"
          rm -rf dexcheck && mkdir -p dexcheck
          unzip -o -q "$APK" "classes*.dex" -d dexcheck
          if strings dexcheck/classes*.dex | grep -q "circumventLimit"; then
            echo "::error::الـ APK ما زال يحتوي على كود القيد (checkLimit) — التعديل لم يُطبَّق!"
            exit 1
          fi
          if ! strings dexcheck/classes*.dex | grep -q "MOD_ZALITH_OFFLINE_ACCOUNTS"; then
            echo "::error::علامة التعديل غير موجودة في الـ APK!"
            exit 1
          fi
          echo "✅ الـ APK مبني من الكود المعدّل (بدون قيد الحسابات غير الرسمية)."

      # هذا الـ step لا يستعمل "set -e" لكي نتمكن من نشر التقرير حتى عند الفشل
      - name: إعادة التوقيع (v1 + v2 + v3) مع تسجيل كل التفاصيل
        run: |
          # ملاحظة: GitHub كيشغّل السكريبت بـ bash -e، ولهذا كنطفيو -e هنا
          # باش نقدرو نكملو ونسجلو التقرير حتى إلا فشل أمر ما
          set +e
          set -uo pipefail
          REPORT=report/signature-report.txt
          : > "$REPORT"
          log() { echo "$@" | tee -a "$REPORT"; }

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          APKSIGNER="$(command -v apksigner || true)"
          [ -n "$APKSIGNER" ] || APKSIGNER="$BT/apksigner"
          ZIPALIGN="$(command -v zipalign || true)"
          [ -n "$ZIPALIGN" ] || ZIPALIGN="$BT/zipalign"

          log "== البيئة =="
          log "ARCH=$ARCH"
          log "SDK=$SDK"
          log "BUILD_TOOLS=$BT"
          log "APKSIGNER=$APKSIGNER  (موجود: $([ -x "$APKSIGNER" ] && echo نعم || echo لا))"
          log "ZIPALIGN=$ZIPALIGN  (موجود: $([ -x "$ZIPALIGN" ] && echo نعم || echo لا))"
          "$APKSIGNER" --version 2>&1 | tee -a "$REPORT"
          "$ZIPALIGN" 2>&1 | head -3 | tee -a "$REPORT" || true

          log ""
          log "== توقيع الـ APK كما أنتجه Gradle =="
          for apk in work/*.apk; do
            log "--- $(basename "$apk")  ($(stat -c%s "$apk") bytes)"
            "$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1 | tee -a "$REPORT" || true
          done

          if [ -n "${KS_PASS:-}" ]; then
            PASS="$KS_PASS"; KEYPASS="$KS_PASS"
            log "كلمة السر: من أسرار المستودع (DEBUG_KEY_PASSWORD)"
          else
            PASS="$(grep -E '^default_store_password=' upstream/ZalithLauncher/gradle.properties | cut -d= -f2-)"
            KEYPASS="$(grep -E '^default_key_password=' upstream/ZalithLauncher/gradle.properties | cut -d= -f2-)"
            log "كلمة السر: القيمة الافتراضية من ZalithLauncher/gradle.properties"
          fi
          version="$(grep -E '^launcher_version_name=' upstream/ZalithLauncher/gradle.properties | cut -d= -f2-)"
          case "$ARCH" in
            arm64) ABIFLAG="arm64-v8a" ;;
            arm)   ABIFLAG="armeabi-v7a" ;;
            *)     ABIFLAG="$ARCH" ;;
          esac

          log ""
          log "== إعادة التوقيع (zipalign + apksigner) =="
          for apk in work/*.apk; do
            aligned="work/aligned-$(basename "$apk")"
            { "$ZIPALIGN" -p -f 4 "$apk" "$aligned" || "$ZIPALIGN" -f 4 "$apk" "$aligned"; } 2>&1 | tee -a "$REPORT"
            zrc=${PIPESTATUS[0]}
            log "zipalign exit=$zrc"
            OUT="out/ZalithLauncher-${version}-mod-offline-${ABIFLAG}.apk"
            "$APKSIGNER" sign \
              --ks upstream/ZalithLauncher/zalith_launcher_debug.jks \
              --ks-type PKCS12 \
              --ks-key-alias movtery_zalith_debug \
              --ks-pass "pass:$PASS" \
              --key-pass "pass:$KEYPASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --min-sdk-version 26 \
              --out "$OUT" "$aligned" 2>&1 | tee -a "$REPORT"
            log "apksigner sign exit=${PIPESTATUS[0]} -> $OUT"
          done

          log ""
          log "== التحقق النهائي من الملفات الموقّعة =="
          for apk in out/*.apk; do
            log "--- $(basename "$apk")  ($(stat -c%s "$apk") bytes)"
            "$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1 | tee -a "$REPORT" || true
            log "مدخلات META-INF (توقيع v1):"
            unzip -l "$apk" 2>&1 | grep -E "META-INF/" | tee -a "$REPORT" || true
            sha256sum "$apk" 2>&1 | tee -a "$REPORT"
          done
          echo "SIGN_STEP_DONE" >> "$REPORT"

      - name: نشر تقرير الفحص (دائمًا، للتشخيص)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ci-report-$ARCH"
          { echo "# تقرير فحص توقيع الـ APK ($ARCH)"; echo; echo '```'; cat report/signature-report.txt 2>/dev/null || echo "(لا يوجد تقرير)"; echo '```'; } > report/body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file report/body.md
          else
            gh release create "$TAG" --title "CI report ($ARCH)" --notes-file report/body.md
          fi

      - name: التحقق من التوقيع (v1 + v2 + v3)
        run: |
          set -euo pipefail
          R=report/signature-report.txt
          # نفحص قسم التحقق النهائي فقط
          awk '/== التحقق النهائي من الملفات الموقّعة ==/{f=1} f' "$R" > report/final.txt
          echo "--- قسم التحقق النهائي ---"
          cat report/final.txt
          fail=0
          for s in v1 v2 v3; do
            if grep -qiE "$s scheme[^:]*: *true" report/final.txt; then
              echo "✅ $s: مفعّل"
            else
              echo "::error::مخطط التوقيع $s غير مُفعّل في الـ APK النهائي!"
              fail=1
            fi
          done
          # توقيع v1 معناه وجود ملفات META-INF/*.SF
          if grep -qE "META-INF/.*\.(SF|RSA|DSA|EC)" report/final.txt; then
            echo "✅ توقيع v1 (JAR) موجود داخل الحزمة"
          else
            echo "::error::لا توجد ملفات توقيع JAR (META-INF/*.SF) — MIUI سيرفض الحزمة!"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "✅ التوقيع سليم: v1 + v2 + v3"

      - name: رفع الـ APK كـ Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zalith-offline-${{ matrix.arch }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: نشر الـ APK في صفحة Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="mod-offline"
          TITLE="Zalith Launcher 2 — نسخة معدّلة (حسابات غير رسمية)"
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" out/*.apk --clobber && break
            else
              gh release create "$TAG" out/*.apk --title "$TITLE" --notes-file .github/RELEASE_NOTES.md && break
            fi
            sleep 10
          done
          gh release view "$TAG" --json assets --jq '.assets[]|"\(.name)  \(.size) bytes"'
