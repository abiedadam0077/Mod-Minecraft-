name: "بناء APK معدّل — Zalith Launcher 2"

# هذا الملف يبني نسخة معدّلة من Zalith Launcher 2 (تشغيل الحسابات غير الرسمية / offline)
# الطريقة: يُنزّل المشروع الأصلي من GitHub + يُطبّق التعديلات الموجودة في مجلد patches/
#
# طرق التشغيل:
#   1) أوتوماتيكيًا: عند أي تعديل على patches/ أو على هذا الملف (البنية الافتراضية: arm64)
#   2) يدويًا: تبويب Actions في المستودع > "بناء APK معدّل" > Run workflow
# ثم حمّل الـ APK من قسم Artifacts أو من صفحة Releases.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "بنية المعالج (arm64 = أغلبية الهواتف الحديثة، arm = هواتف قديمة 32bit، all = كل البنيات)"
        type: choice
        default: arm64
        options:
          - arm64
          - arm
          - x86_64
          - all
      upstream_ref:
        description: "نسخة ZalithLauncher2 الأصلية (commit SHA أو فرع)"
        type: string
        default: e6cb4f415930c78ce1ecc10062b2bc1026802d4d
      publish_release:
        description: "نشر الـ APK في صفحة Releases لسهولة التحميل من الهاتف؟"
        type: boolean
        default: true
  push:
    paths:
      - "patches/**"
      - ".github/workflows/build-apk.yml"
      - "UPSTREAM_COMMIT"

permissions:
  contents: write

env:
  # القيم الافتراضية عند التشغيل التلقائي (push) — المدخلات اليدوية تتقدّم عليها
  ARCH: ${{ inputs.arch || 'arm64' }}
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'e6cb4f415930c78ce1ecc10062b2bc1026802d4d' }}

jobs:
  build:
    name: Build (${{ inputs.arch || 'arm64' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: تنزيل هذا المستودع (التعديلات)
        uses: actions/checkout@v6

      - name: تنزيل ZalithLauncher2 الأصلي
        run: |
          set -euo pipefail
          git init -q upstream
          cd upstream
          git remote add origin https://github.com/ZalithLauncher/ZalithLauncher2.git
          git fetch -q --depth 1 origin "$UPSTREAM_REF"
          git checkout -q FETCH_HEAD
          echo "ZalithLauncher2 commit: $(git rev-parse HEAD)"

      - name: تطبيق التعديلات (تشغيل الحسابات غير الرسمية)
        run: |
          set -euo pipefail
          cd upstream
          for p in ../patches/*.patch; do
            echo "==> applying: $p"
            git apply -p1 --verbose "$p"
          done
          echo "--- التعديلات المطبّقة ---"
          git --no-pager diff --stat

      - name: تهيئة JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: تهيئة Gradle (مع الكاش لتسريع البناء)
        uses: gradle/actions/setup-gradle@v5

      - name: بناء الـ APK
        working-directory: upstream
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew "ZalithLauncher:assembleDebug" "-Darch=$ARCH"

      - name: تجميع ملفات الـ APK الناتجة
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          find upstream/ZalithLauncher/build/outputs/apk/debug -name "*.apk" -exec cp -v {} out/ \;
          ls -lh out/
          echo "apk_count=$(ls out/*.apk | wc -l)" >> "$GITHUB_OUTPUT"

      - name: رفع الـ APK كـ Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zalith-offline-${{ env.ARCH }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: نشر الـ APK في صفحة Releases
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="mod-offline-$ARCH"
          TITLE="Zalith Launcher 2 — نسخة معدّلة (حسابات غير رسمية) [$ARCH]"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" out/*.apk --title "$TITLE" --notes-file .github/RELEASE_NOTES.md
          fi
